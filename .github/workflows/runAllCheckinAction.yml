name: 每日聚合签到 (GLaDOS + Railgun)

on:
  workflow_dispatch:
  schedule:
    # UTC 1点30分(北京时间 9点30分)
    - cron: 30 1 * * *
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin all
        run: |
          python3 main.py
        env: 
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          RAILGUN_COOKIE: ${{ secrets.RAILGUN_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}
