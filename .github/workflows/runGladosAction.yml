name: 单独运行Glados签到

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env: 
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_NETWORK_COOKIE: ${{ secrets.GLADOS_NETWORK_COOKIE }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}
