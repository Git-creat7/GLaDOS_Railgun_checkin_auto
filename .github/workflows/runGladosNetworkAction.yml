name: 开始每日签到GladosNetwork

on:
  workflow_dispatch:
  schedule:
    # UTC 3点30分(北京时间 11点30分)
    - cron: 30 3 * * *
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: 3.9
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados_network.py
        env:
          GLADOS_NETWORK_COOKIE: ${{ secrets.GLADOS_NETWORK_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
